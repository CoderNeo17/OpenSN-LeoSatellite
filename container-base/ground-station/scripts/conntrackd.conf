Sync {
    Mode FTFW {
        DisableExternalCache Off
        CommitTimeout 1800
    }
    UDP Default {
        IPv4_address <THIS_GATEWAY_IP>

        # list all other gateway IPs here
        IPv4_Destination_Address <GATEWAY_B_IP>
        IPv4_Destination_Address <GATEWAY_C_IP>

        Port 3780
        Interface docker0
        Checksum on
    }
}

General {
    HashSize 32768
    HashLimit 131072
    Filter From Kernelspace {
        Protocol Accept {
            TCP
            UDP
            ICMP
        }
    }
}